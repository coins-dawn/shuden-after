<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終電のあと</title>
<style>
  :root {
    --bg: #070a0f;
    --ink: #eef1f6;
    --sub: #8e97a8;
    --faint: #39404e;
    --home: #ffd166;
    --ok: #5fd3b2;
    --soon: #ffd166;
    --gone: #ff6b7a;
    --panel: rgba(9, 12, 18, .88);
    --line: rgba(238, 241, 246, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; cursor: grab; }

  .head { position: absolute; top: 18px; left: 20px; z-index: 3; pointer-events: none; }
  .head h1 { margin: 0; font-size: 20px; letter-spacing: .16em; font-weight: 600; }
  .head p { margin: 6px 0 0; font-size: 12px; color: var(--sub); letter-spacing: .06em; }

  .panel { position: absolute; top: 86px; left: 20px; z-index: 3; width: 300px;
    max-width: calc(100vw - 40px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 4px; padding: 14px 15px 15px; }
  .row { margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .lab { font-size: 11px; color: var(--sub); letter-spacing: .08em; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: baseline; }
  .lab b { color: var(--home); font-size: 14px; font-weight: 600; letter-spacing: 0; }
  input[type=range] { width: 100%; accent-color: var(--home); height: 18px; }
  select { width: 100%; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer;
    color: var(--ink); background: rgba(238,241,246,.06);
    border: 1px solid var(--line); border-radius: 3px;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%),
      linear-gradient(135deg, var(--sub) 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  select:focus { outline: none; border-color: var(--home); }
  select option { background: #0b0f17; color: var(--ink); }
  .ends { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); }
  .toggle { font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; color: var(--sub);
    background: rgba(238,241,246,.05); border: 1px solid var(--line); border-radius: 2px; }
  .toggle:hover { color: var(--ink); border-color: rgba(238,241,246,.3); }
  .toggle[aria-pressed="true"] { color: #070a0f; background: var(--home); border-color: var(--home); }
  .toggle.wide { width: 100%; margin-top: 8px; padding: 7px 10px; }
  .zoom { display: flex; gap: 5px; }
  .zoom .toggle { min-width: 34px; text-align: center; flex: none; }
  .hint { display: block; font-size: 10px; color: var(--faint); margin-top: 6px; }

  .list { position: absolute; top: 86px; right: 20px; z-index: 3; width: 286px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 13px 13px; max-height: calc(100vh - 150px); overflow: auto; }
  .list h2 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .06em; font-weight: 600;
    line-height: 1.35; }
  .item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
    gap: 8px; padding: 5px 0; border-bottom: 1px solid rgba(238,241,246,.07); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover, .item.on { background: rgba(238,241,246,.06); }
  .item.on { box-shadow: inset 2px 0 0 var(--home); }
  .item.sel { background: rgba(255,209,102,.10); box-shadow: inset 3px 0 0 var(--home); }
  .item.sel .nm { color: var(--home); }
  .item .nm { font-size: 13px; line-height: 1.3; }
  .item .nm small { color: var(--faint); font-size: 10px; margin-left: 5px; }
  .item .vl { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .item .sub { font-size: 9.5px; color: var(--sub); margin-top: 1px; line-height: 1.35; }
  .item .alt { flex-basis: 100%; font-size: 10px; color: var(--faint); margin-top: 2px;
    line-height: 1.3; white-space: nowrap; }
  .item .alt b { color: var(--ok); font-weight: 600; }
  .item .col { display: flex; flex-direction: column; align-items: flex-end; flex: 0 0 auto; }
  /* 名前と内訳の側を縮むようにしておかないと、長い駅名のときに金額が次の行へ落ちる */
  .item > div:first-child { flex: 1 1 0; min-width: 0; }
  /* 長い駅名（高輪ゲートウェイ など）のときだけ 2 行になる。切り詰めると km が消えるため */

  .foot { position: absolute; bottom: 0; left: 0; right: 0; padding: 9px 20px; z-index: 3;
    font-size: 10.5px; color: var(--faint); line-height: 1.6; }
  .foot a { color: #6c7686; }
  .toast { position: absolute; z-index: 4; pointer-events: none; top: 24px;
    left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity .5s;
    background: var(--panel); border: 1px solid rgba(255,107,122,.45); border-radius: 3px;
    padding: 7px 14px; font-size: 13px; letter-spacing: .04em; white-space: nowrap; }
  .toast b { color: var(--gone); font-weight: 600; }
  .toast.show { opacity: 1; transition: opacity .12s; }
  @media (max-width: 820px) { .toast { font-size: 11.5px; padding: 5px 10px; top: 54px; } }
  .tip { position: absolute; z-index: 4; pointer-events: none; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    padding: 5px 9px; font-size: 12px; white-space: nowrap; }
  .tip b { color: var(--home); font-weight: 600; }
  .busy { position: absolute; top: 20px; right: 330px; z-index: 5; font-size: 11px;
    color: var(--home); letter-spacing: .1em; display: none; }
  @media (max-width: 820px) {
    .list { display: none; }
    .panel { width: calc(100vw - 24px); left: 12px; top: 74px; padding: 10px 11px 11px; }
    .head { top: 12px; left: 14px; }
    .head h1 { font-size: 17px; }
    .head p { font-size: 11px; margin-top: 3px; }
    .row { margin-bottom: 9px; }
    .lab { margin-bottom: 4px; }
    .toggle.wide { margin-top: 5px; padding: 6px 10px; }
    .hint { display: none; }
    .foot { padding: 6px 12px; font-size: 9.5px; line-height: 1.45;
            max-height: 30vh; overflow: auto; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="head">
  <h1>終電のあと</h1>
  <p>終電を逃したら、どこで飲んでいたかで痛みが変わる。</p>
</div>

<div class="panel">
  <div class="row">
    <div class="lab"><span>自宅の最寄り駅</span><b id="home-name">—</b></div>
    <select id="home-sel"></select>
  </div>
  <div class="row">
    <div class="lab"><span>いま店を出る時刻</span><b id="time-val">22:00</b></div>
    <input id="time" type="range" min="1200" max="1620" step="5" value="1320">
    <div class="ends"><span>20:00</span><span>翌 03:00</span></div>
    <button class="toggle wide" id="play" aria-pressed="false">時刻を進める</button>
  </div>
  <div class="row">
    <div class="lab"><span>ズーム</span><b id="zoom-val">1.0×</b></div>
    <div class="zoom">
      <button class="toggle" id="zoom-out">−</button>
      <button class="toggle" id="zoom-in">＋</button>
      <button class="toggle" id="zoom-reset">全体</button>
    </div>
    <span class="hint">ホイールで拡大／ドラッグで移動</span>
  </div>
</div>

<div class="list">
  <h2 id="list-title">飲む場所ごとの帰り方</h2>
  <div id="items"></div>
</div>

<div class="toast" id="toast"></div>
<div class="foot" id="foot"></div>
<div class="tip" id="tip"></div>
<div class="busy" id="busy">計算中</div>

<script>
(async function () {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const base = await (await fetch('data/base.json')).json();
  const land = await fetch('data/land.json').then(r => r.ok ? r.json() : null).catch(() => null);
  const SPOTS = await (await fetch('data/spots.json')).json();
  const INDEX = await (await fetch('data/index.json')).json();
  const NODES = base.nodes, EDGES = base.edges, COLORS = base.colors;
  const N = NODES.length;
  const VIS = []; for (let i = 0; i < N; i++) if (NODES[i].v) VIS.push(i);

  // ---- 投影 ----
  const latMean = NODES.reduce((s, n) => s + (n.v ? n.y : 0), 0) / VIS.length;
  const kx = Math.cos(latMean * Math.PI / 180);
  const geoX = new Float64Array(N), geoY = new Float64Array(N);
  const landLon = [], landLat = [], landRange = [];
  if (land) for (const line of land.lines) {
    const a = landLon.length;
    for (const [lo, la] of line) { landLon.push(lo); landLat.push(la); }
    landRange.push([a, landLon.length]);
  }
  const LV = landLon.length;
  const landX = new Float64Array(LV), landY = new Float64Array(LV);
  let W = 0, H = 0, dpr = 1;
  // 緯度経度をそのまま画面に写すための係数（経路の形を描くのに使う）
  let gx0 = 0, gy0 = 0, gs = 1, gox = 0, goy = 0;

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const i of VIS) {
      const gx = NODES[i].x * kx, gy = -NODES[i].y;
      if (gx < x0) x0 = gx; if (gx > x1) x1 = gx;
      if (gy < y0) y0 = gy; if (gy > y1) y1 = gy;
    }
    // 余白はパネルの実際の位置から取る。固定値（340/310）だと、
    // 幅 390 の画面で地図が 200px に潰れてしまう
    const rect = sel => {
      const el = document.querySelector(sel);
      return el && getComputedStyle(el).display !== 'none' ? el.getBoundingClientRect() : null;
    };
    const lr = rect('.list'), pr = rect('.panel'), fr = rect('.foot');
    let padL = 20, padR = 20, padT = 70;
    const padB = fr ? Math.max(20, H - fr.top + 10) : 70;
    if (lr) padR = Math.max(padR, W - lr.left + 20);
    if (pr) {
      // 横に 220px 以上残るなら横に避ける。残らないなら（＝狭い画面）下に避ける
      if (pr.right + 20 + 220 < W - padR) padL = Math.max(padL, pr.right + 20);
      else padT = Math.max(padT, pr.bottom + 16);
    }
    const aw = Math.max(200, W - padL - padR), ah = Math.max(200, H - padT - padB);
    const s = Math.min(aw / (x1 - x0), ah / (y1 - y0));
    const ox = padL + (aw - (x1 - x0) * s) / 2, oy = padT + (ah - (y1 - y0) * s) / 2;
    gx0 = x0; gy0 = y0; gs = s; gox = ox; goy = oy;
    for (let i = 0; i < N; i++) {
      geoX[i] = ox + (NODES[i].x * kx - x0) * s;
      geoY[i] = oy + (-NODES[i].y - y0) * s;
    }
    for (let v = 0; v < LV; v++) {
      landX[v] = ox + (landLon[v] * kx - x0) * s;
      landY[v] = oy + (-landLat[v] - y0) * s;
    }
  }

  // ---- ビュー（ズーム・移動）----
  const view = { k: 1, tx: 0, ty: 0 };
  const SX = i => geoX[i] * view.k + view.tx;
  const SY = i => geoY[i] * view.k + view.ty;

  function clampView() {
    let sx = 0, sy = 0;
    for (const i of VIS) { sx += geoX[i]; sy += geoY[i]; }
    const mx = sx / VIS.length * view.k + view.tx, my = sy / VIS.length * view.k + view.ty;
    const pad = 80;
    if (mx < pad) view.tx += pad - mx;
    if (mx > W - pad) view.tx += (W - pad) - mx;
    if (my < pad) view.ty += pad - my;
    if (my > H - pad) view.ty += (H - pad) - my;
  }
  function zoomAt(mx, my, f) {
    const k2 = Math.max(0.7, Math.min(24, view.k * f));
    if (k2 === view.k) return;
    view.tx = mx - (mx - view.tx) * (k2 / view.k);
    view.ty = my - (my - view.ty) * (k2 / view.k);
    view.k = k2; clampView(); zoomVal.textContent = view.k.toFixed(1) + '×'; draw();
  }

  // ---- 状態 ----
  let home = INDEX.homes[0].node;
  let t0 = 1320;
  let data = null;
  let hover = -1;
  let picked = -1;       // 一覧や札をタップして選んだ駅。hover より優先する
  let anim = null;       // ズームの動き。動いている間は札を描かない
  const act = () => (picked >= 0 ? picked : hover);

  const COL = { train: '#5fd3b2', soon: '#ffd166', taxi: '#ff6b7a', home: '#ffd166' };
  const stateColor = s => s.state === 'home' ? COL.home
    : s.state === 'train' ? (s.left <= 15 ? COL.soon : COL.train) : COL.taxi;

  const fmt = v => String(Math.floor(v / 60) % 24).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
  const yen = v => '¥' + v.toLocaleString();
  const span = m => (m >= 60 ? Math.floor(m / 60) + '時間' + (m % 60 ? (m % 60) + '分' : '')
                             : m + '分');

  // ---- 夜の深まり ----
  // 時刻が進むほど画面を暗くする。20:00 は夕方の青、翌03:00 はほとんど黒。
  // 真夜中あたりでいちばん速く落ちるように、両端をなめらかにした。
  // 暗くするのは**背景の層だけ**（海岸線・路線・駅の点）。
  // 札と帰り道は読めないと意味がないので、明るさを変えない。
  const DUSK = [15, 22, 40], DEEP = [2, 4, 9];
  let nn = 0;                              // 0=夕方 … 1=真夜中過ぎ
  function nightness(t) {
    const u = Math.max(0, Math.min(1, (t - 1200) / 420));
    return u * u * (3 - 2 * u);
  }
  const mixCh = (a, b, u) => Math.round(a + (b - a) * u);
  const bgRGB = () => DUSK.map((v, i) => mixCh(v, DEEP[i], nn));
  const bgCss = () => 'rgb(' + bgRGB().join(',') + ')';
  const fade = (near, far) => near + (far - near) * nn;

  function setNight(t) {
    nn = nightness(t);
    const c = bgCss();
    document.documentElement.style.setProperty('--bg', c);
    // パネルも背景に合わせて沈める
    const [r, g, b] = bgRGB();
    document.documentElement.style.setProperty(
      '--panel', 'rgba(' + (r + 2) + ',' + (g + 3) + ',' + (b + 6) + ',.88)');
  }

  // ---- 描画 ----
  function draw() {
    ctx.fillStyle = bgCss();
    ctx.fillRect(0, 0, W, H);

    // 海岸線・県境
    if (LV) {
      ctx.strokeStyle = 'rgba(134,150,180,' + fade(0.40, 0.11).toFixed(3) + ')';
      ctx.lineWidth = 1; ctx.lineJoin = 'round';
      ctx.beginPath();
      for (const [a, b] of landRange) {
        ctx.moveTo(landX[a] * view.k + view.tx, landY[a] * view.k + view.ty);
        for (let v = a + 1; v < b; v++) ctx.lineTo(landX[v] * view.k + view.tx, landY[v] * view.k + view.ty);
      }
      ctx.stroke();
    }

    // 路線（うっすら）
    ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    const byColor = new Map();
    for (const [a, b, c] of EDGES) {
      if (!NODES[a].v || !NODES[b].v) continue;
      let g = byColor.get(c); if (!g) { g = []; byColor.set(c, g); }
      g.push(a, b);
    }
    for (const [c, arr] of byColor) {
      const h = (COLORS[c] || '#8d93a0').replace('#', '');
      ctx.strokeStyle = 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16)
        + ',' + parseInt(h.slice(4,6),16) + ',' + fade(0.46, 0.12).toFixed(3) + ')';
      ctx.beginPath();
      for (let k = 0; k < arr.length; k += 2) {
        ctx.moveTo(SX(arr[k]), SY(arr[k])); ctx.lineTo(SX(arr[k+1]), SY(arr[k+1]));
      }
      ctx.stroke();
    }

    // 駅（点）
    ctx.fillStyle = 'rgba(238,241,246,' + fade(0.40, 0.12).toFixed(3) + ')';
    for (const i of VIS) {
      ctx.beginPath(); ctx.arc(SX(i), SY(i), NODES[i].w > 2 ? 1.6 : 1.0, 0, Math.PI * 2); ctx.fill();
    }

    // 画面のふちを落とす。夜が深まるほど強くして、中心に目が寄るようにする
    if (nn > 0.02) {
      const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18,
                                         W / 2, H / 2, Math.max(W, H) * 0.72);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,' + (0.55 * nn).toFixed(3) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // 帰り道（電車の区間＋タクシーの区間）
    if (data) {
      for (const s of data.spots) {
        if (s.state !== 'taxi' || s.off == null) continue;
        const A = act();
        const dim = A >= 0 && A !== s.node;
        // 電車で行けるところまで。経路の形が来ていればそれをなぞる
        if (s.off !== s.node) {
          ctx.strokeStyle = dim ? 'rgba(255,209,102,.18)' : 'rgba(255,209,102,.55)';
          ctx.lineWidth = 1.8; ctx.setLineDash([]);
          trace(s.trainPath, s.node, s.off);
        }
        // そこから自宅までタクシー
        ctx.strokeStyle = dim ? 'rgba(255,107,122,.18)' : 'rgba(255,107,122,.75)';
        ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        trace(s.taxiPath, s.off, home);
        ctx.setLineDash([]);
        // 降りる駅
        ctx.fillStyle = dim ? 'rgba(255,209,102,.3)' : '#ffd166';
        ctx.beginPath(); ctx.arc(SX(s.off), SY(s.off), 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ---- 札 ----
    // 置き場所は labelLayout() が 自宅・ビュー ごとに 1 回だけ決める（時刻では動かさない）。
    // ズームが動いている間は置き場所を探し直すことになるので、札は描かない。
    const lay = anim ? null : labelLayout();
    HITS.length = 0;

    // 自宅
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(SX(home), SY(home), 9, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(SX(home), SY(home), 3, 0, Math.PI * 2); ctx.fill();
    if (lay) chip(lay.home.x, lay.home.y, '自宅・' + NODES[home].n, '', '#ffd166', 0, false, false);

    if (data) {
      // 終電が落ちた駅から、輪が広がって消える
      if (flashes.size) {
        const now = performance.now();
        for (const s of data.spots) {
          const at = flashes.get(s.node);
          if (at == null) continue;
          const u = Math.min(1, (now - at) / FLASH_MS);
          const e = 1 - Math.pow(1 - u, 2);
          const r = 7 + 32 * e;
          const ring = () => {
            ctx.beginPath();
            ctx.arc(SX(s.node), SY(s.node), r, 0, Math.PI * 2);
            ctx.stroke();
          };
          // 路線図の上で見えるように、まず暗い縁を敷く
          ctx.globalAlpha = (1 - u) * 0.7;
          ctx.strokeStyle = bgCss(); ctx.lineWidth = 5.5 * (1 - u) + 1.5; ring();
          ctx.globalAlpha = (1 - u) * 0.95;
          ctx.strokeStyle = COL.taxi; ctx.lineWidth = 3.0 * (1 - u) + 0.7; ring();
          ctx.globalAlpha = 1;
        }
      }

      // 札と点をつなぐ線。近い札でも短い線を出す。
      // これが無いと、どの札がどの点のものか分からない
      ctx.setLineDash([]);
      for (const s of data.spots) {
        const p = lay && lay.at[s.node];
        if (!p) continue;
        const A = act(), on = A === s.node, dim = A >= 0 && !on;
        const x = SX(s.node), y = SY(s.node);
        const ex = p.ax - 4 * p.side, ey = p.ay;
        const d = Math.hypot(ex - x, ey - y);
        if (d < 11) continue;                 // 札が点に接していれば要らない
        const t = 7.5 / d;                    // 点のふちから描きはじめる
        const sx = x + (ex - x) * t, sy = y + (ey - y) * t;
        const path = () => {
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(ex, ey);
          ctx.stroke();
        };
        // 路線図の上を横切るので、まず暗い縁を敷いて線を浮かせる
        ctx.globalAlpha = dim ? .25 : .8;
        ctx.strokeStyle = bgCss(); ctx.lineWidth = on ? 4 : 3; path();
        // 黄（電車）・赤破線（タクシー）は意味を持つ線なので、
        // ただ札と点を結ぶだけのこの線は中立の色にして取り合わない
        ctx.strokeStyle = on ? stateColor(s) : '#b9c2d1';
        ctx.globalAlpha = dim ? .12 : on ? .9 : .5;
        ctx.lineWidth = on ? 1.6 : 1;
        path();
        if (d > 40) {
          ctx.beginPath(); ctx.arc(ex, ey, on ? 2.6 : 1.8, 0, Math.PI * 2);
          ctx.fillStyle = on ? stateColor(s) : '#b9c2d1'; ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // 候補の駅（点）
      for (const s of data.spots) {
        if (s.node === home) continue;          // 自宅の印と重なるので出さない
        const x = SX(s.node), y = SY(s.node);
        const A = act(), on = A === s.node, dim = A >= 0 && !on;
        const fa = flashes.get(s.node);
        const pulse = fa == null ? 0 : Math.max(0, 1 - (performance.now() - fa) / FLASH_MS);
        ctx.globalAlpha = dim ? .45 : 1;
        ctx.fillStyle = stateColor(s);
        ctx.beginPath(); ctx.arc(x, y, (on ? 7.5 : 6) + 4 * pulse, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = bgCss();
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // 札
      for (const s of data.spots) {
        const p = lay && lay.at[s.node];
        if (!p) continue;
        const A = act(), on = A === s.node;
        const txt = s.state === 'train' ? 'あと ' + s.left + '分'
          : s.state === 'taxi' ? yen(s.fare) : '—';
        chip(p.x, p.y, s.name, txt, stateColor(s), p.nameW, on, A >= 0 && !on);
        HITS.push([p.x - 7, p.y - 12, p.x + p.w + 7, p.y + 12, s.node]);
      }
    }
  }

  // ---- 札の配置 ----
  // 全体表示だと候補 10 駅のうち 8 駅が 170×80px に収まってしまい（新宿–渋谷 30px、
  // 上野–錦糸町 31px）、点のそばには置けない。離れたところに置いて引き出し線で戻すが、
  // 素直に置くと線どうしが交差して、どの札がどの駅か追えなくなる。
  // そこで **交差の数を数えながら置き場所を選ぶ**。
  // 配置は 自宅・ビュー ごとに 1 回だけ決める。時刻で文字幅が変わっても札が動かない。
  const HITS = [];
  const PADX = 16, PADY = 13;   // 札のまわりに空ける余白。隣の札と 1 行に見えないように
  const DIRS = 16;              // 点のまわりに試す向き
  const RADII = [22, 46, 74, 108, 148, 196, 250];
  // 点数づけの重み。交差をいちばん嫌う
  const W_HIT = 100000, W_CROSS = 4000, W_NEARDOT = 700, W_OVERDOT = 1500, W_FAR = 1.0;
  const W_LEFT = 60;            // 左に伸ばすと駅名が点から遠くなるので、右を優先する
  let layKey = '', layVal = null;

  function labelLayout() {
    // 札を置いてよい範囲と、避ける場所。避ける場所は実際のパネルの位置から取る
    // （狭い幅では一覧が消え、操作パネルが横いっぱいに広がるため）
    const L = 10, R = W - 10, T = 64, B = H - 56;
    const walls = [];
    for (const sel of ['.head', '.panel', '.list', '.foot']) {
      const el = document.querySelector(sel);
      if (!el || getComputedStyle(el).display === 'none') continue;
      const r = el.getBoundingClientRect();
      // 一覧は中身で高さが変わるので、下は画面下に固定して扱う。
      // 残りも 20px に丸める。中身が少し変わるたびに札が組み直されないように
      const bot = sel === '.list' ? H - 44 : r.bottom + 8;
      walls.push([Math.floor((r.left - 10) / 20) * 20, Math.floor((r.top - 8) / 20) * 20,
                  Math.ceil((r.right + 10) / 20) * 20, Math.ceil(bot / 20) * 20]);
    }
    // 時刻は鍵に入れない。文字幅が変わっても札が動かないようにするため
    const key = [home, picked, view.k.toFixed(3), Math.round(view.tx), Math.round(view.ty),
      W, H, walls.join(';')].join('|');
    if (key === layKey && layVal) return layVal;

    // 値は時刻で変わるので、取りうるいちばん広い文字で場所を取っておく
    // （「あと 155分」は「¥00,000」より広い）
    const VW = Math.max(measure('¥00,000', 13.5), measure('あと 999分', 13.5));
    // 1 つ選んでいるときは、その札だけ置く（ほかは点だけ残して邪魔をしない）
    const sp = SPOTS.filter(s => s.node !== home && (picked < 0 || s.node === picked)).map(s => {
      const nw = measure(s.name, 13);
      return { node: s.node, name: s.name, x: SX(s.node), y: SY(s.node), nw, w: nw + 12 + VW };
    });
    // 札が駅の点に乗らないようにする。こちらは余白なしで判定する
    const dots = sp.map(s => [s.x, s.y]).concat([[SX(home), SY(home)]]);

    // 自宅の札は先に置いて、以後は動かない壁として扱う
    const hw = measure('自宅・' + NODES[home].n, 13);
    const hp = ring(SX(home), SY(home), hw, walls, dots, L, R, T, B);
    walls.push([hp.x - PADX, hp.y - PADY, hp.x + hw + PADX, hp.y + PADY]);

    // 候補の置き場所を、点のまわりに放射状に用意する
    const cand = sp.map(s => {
      const out = [];
      for (const r of RADII)
        for (let a = 0; a < DIRS; a++) {
          const th = a * 2 * Math.PI / DIRS;
          const ax = s.x + Math.cos(th) * r, ay = s.y + Math.sin(th) * r;
          const right = Math.cos(th) >= -1e-9;
          const x = right ? ax : ax - s.w;
          if (x < L || x + s.w > R || ay < T || ay > B) continue;
          if (walls.some(o => overlap([x - PADX, ay - PADY, x + s.w + PADX, ay + PADY], o))) continue;
          out.push({ x, y: ay, ax, ay, side: right ? 1 : -1, r,
                     box: [x - PADX, ay - PADY, x + s.w + PADX, ay + PADY],
                     rect: [x - 5, ay - 11, x + s.w + 5, ay + 11] });
        }
      return out;
    });

    // その置き場所の悪さ。交差・重なり・点を隠すことを数える
    const cost = (i, c, put) => {
      let v = W_FAR * c.r;
      if (c.side < 0) v += W_LEFT;
      for (const o of dots) {                         // 札が駅の点に乗らない
        if (o[0] >= c.rect[0] && o[0] <= c.rect[2] && o[1] >= c.rect[1] && o[1] <= c.rect[3])
          v += W_OVERDOT;
        if (nearSeg(o[0], o[1], sp[i].x, sp[i].y, c.ax, c.ay) < 8) v += W_NEARDOT;
      }
      for (let j = 0; j < sp.length; j++) {
        const d = put[j];
        if (j === i || !d) continue;
        if (overlap(c.box, d.box)) v += W_HIT;
        if (cross(sp[i].x, sp[i].y, c.ax, c.ay, sp[j].x, sp[j].y, d.ax, d.ay)) v += W_CROSS;
      }
      return v;
    };

    // いちばん置きにくいものから置き、そのあと順に置き直して交差を減らす
    const put = new Array(sp.length).fill(null);
    const order = sp.map((_, i) => i).sort((a, b) => cand[a].length - cand[b].length);
    for (let pass = 0; pass < 5; pass++)
      for (const i of order) {
        put[i] = null;
        let best = null, bv = Infinity;
        for (const c of cand[i]) {
          const v = cost(i, c, put);
          if (v < bv) { bv = v; best = c; }
        }
        put[i] = best || fallback(sp[i], walls, L, R, T, B);
      }

    const at = {};
    sp.forEach((s, i) => {
      const c = put[i];
      at[s.node] = { x: c.x, y: c.y, ax: c.ax, ay: c.ay, w: s.w, nameW: s.nw, side: c.side };
    });
    layKey = key; layVal = { home: hp, at };
    return layVal;
  }

  // どこにも置けなかったとき。枠の中をあらく走査していちばん近い空きを使う
  function fallback(s, walls, L, R, T, B) {
    let best = null, bd = Infinity;
    for (let by = T; by <= B; by += 16)
      for (let bx = L; bx + s.w <= R; bx += 24) {
        const d = (bx - s.x) ** 2 + (by - s.y) ** 2;
        if (d >= bd) continue;
        if (walls.some(o => overlap([bx - PADX, by - PADY, bx + s.w + PADX, by + PADY], o))) continue;
        bd = d; best = { x: bx, y: by, ax: bx, ay: by, side: 1, r: Math.sqrt(d),
                         box: [bx - PADX, by - PADY, bx + s.w + PADX, by + PADY],
                         rect: [bx - 5, by - 11, bx + s.w + 5, by + 11] };
      }
    const x = Math.max(L, Math.min(s.x + 12, R - s.w)), y = Math.max(T, Math.min(s.y, B));
    return best || { x, y, ax: x, ay: y, side: 1, r: 12,
                     box: [x - PADX, y - PADY, x + s.w + PADX, y + PADY],
                     rect: [x - 5, y - 11, x + s.w + 5, y + 11] };
  }

  const overlap = (a, b) => !(a[2] < b[0] || b[2] < a[0] || a[3] < b[1] || b[3] < a[1]);

  // 2 本の線分が交わるか
  function cross(ax, ay, bx, by, cx, cy, dx, dy) {
    const s = (px, py, qx, qy, rx, ry) =>
      Math.sign((qx - px) * (ry - py) - (qy - py) * (rx - px));
    return s(ax, ay, bx, by, cx, cy) !== s(ax, ay, bx, by, dx, dy)
        && s(cx, cy, dx, dy, ax, ay) !== s(cx, cy, dx, dy, bx, by);
  }

  // 点と線分の距離
  function nearSeg(px, py, ax, ay, bx, by) {
    const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy;
    const t = l ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / l)) : 0;
    return Math.hypot(px - ax - vx * t, py - ay - vy * t);
  }

  // 自宅の札だけは、点のまわりを 12 方向 × 3 段で探して置く
  function ring(x, y, w, walls, dots, L, R, T, B) {
    const free = (bx, by) => {
      if (bx < L || bx + w > R || by < T || by > B) return false;
      const b = [bx - PADX, by - PADY, bx + w + PADX, by + PADY];
      const r = [bx - 5, by - 11, bx + w + 5, by + 11];
      return !walls.some(o => overlap(b, o))
        && !dots.some(o => o[0] >= r[0] && o[0] <= r[2] && o[1] >= r[1] && o[1] <= r[3]);
    };
    for (const d of [12, 38, 64]) {
      for (let a = 0; a < 12; a++) {
        const th = (a % 2 ? -1 : 1) * Math.floor((a + 1) / 2) * (Math.PI / 6);
        const px = x + Math.cos(th) * d, py = y + Math.sin(th) * d;
        const bx = Math.cos(th) >= 0 ? px : px - w;
        if (free(bx, py)) return { x: bx, y: py };
      }
    }
    return { x: Math.max(L, Math.min(x + 12, R - w)), y: Math.max(T, Math.min(y, B)) };
  }

  // 1 行の札。駅名と値を同じ行に並べる（2 行だと都心で場所が足りない）。
  // nameW を渡すと値の左端がそろうので、束ねたときに表になる。
  function chip(x, y, name, val, color, nameW, on, dim) {
    const nw = measure(name, 13);
    const vx = x + Math.max(nameW, nw) + 12;
    ctx.font = '600 13.5px "Hiragino Sans","Noto Sans JP",sans-serif';
    const w = val ? vx - x + ctx.measureText(val).width : nw;
    const [br, bg_, bb] = bgRGB();
    ctx.globalAlpha = dim ? .34 : 1;
    ctx.fillStyle = 'rgba(' + br + ',' + bg_ + ',' + bb + ',' + (on ? .96 : .84) + ')';
    ctx.fillRect(x - 6, y - 11, w + 12, 22);
    if (on) {
      ctx.strokeStyle = color; ctx.globalAlpha = .6; ctx.lineWidth = 1;
      ctx.strokeRect(x - 6.5, y - 11.5, w + 13, 23); ctx.globalAlpha = 1;
    }
    ctx.textBaseline = 'middle';
    ctx.font = '13px "Hiragino Sans","Noto Sans JP",sans-serif';
    ctx.fillStyle = '#eef1f6'; ctx.fillText(name, x, y);
    if (val) {
      ctx.font = '600 13.5px "Hiragino Sans","Noto Sans JP",sans-serif';
      ctx.fillStyle = color; ctx.fillText(val, vx, y);
    }
    ctx.globalAlpha = 1;
  }

  // 緯度経度 → 地図の座標（ビューをかける前）
  const GX = lon => gox + (lon * kx - gx0) * gs;
  const GY = lat => goy + (-lat - gy0) * gs;

  // 経路の形（[[lat, lon], ...]）をなぞる。無ければ 2 駅を直線で結ぶ
  function trace(path, a, b) {
    ctx.beginPath();
    if (path && path.length > 1) {
      for (let i = 0; i < path.length; i++) {
        const x = GX(path[i][1]) * view.k + view.tx;
        const y = GY(path[i][0]) * view.k + view.ty;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
    } else {
      ctx.moveTo(SX(a), SY(a)); ctx.lineTo(SX(b), SY(b));
    }
    ctx.stroke();
  }

  // ---- 一覧や札をタップしたときの、強調とズーム ----

  // パネルに隠れない範囲。狭い画面では操作パネルが横いっぱいなので下に避ける
  function freeArea() {
    const box = sel => {
      const el = document.querySelector(sel);
      return el && getComputedStyle(el).display !== 'none' ? el.getBoundingClientRect() : null;
    };
    let L = 20, R = W - 20, T = 96, B = H - 64;
    const list = box('.list'), panel = box('.panel');
    if (list) R = Math.min(R, list.left - 24);
    if (panel) {
      if (panel.right + 24 + 200 < R) L = Math.max(L, panel.right + 24);
      else T = Math.max(T, panel.bottom + 20);
    }
    return [L, T, R, B];
  }

  // その帰り方が通るところ（出先・降りる駅・自宅・経路の形）を囲む
  function routeBox(s) {
    const xs = [], ys = [];
    const add = (lat, lon) => { xs.push(GX(lon)); ys.push(GY(lat)); };
    add(NODES[s.node].y, NODES[s.node].x);
    add(NODES[home].y, NODES[home].x);
    if (s.off != null) add(NODES[s.off].y, NODES[s.off].x);
    for (const p of (s.trainPath || [])) add(p[0], p[1]);
    for (const p of (s.taxiPath || [])) add(p[0], p[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  }

  // 四角が収まるようにビューを動かす（少し動かして見せる）
  function flyTo(box) {
    const [L, T, R, B] = freeArea();
    const pad = 46;
    const w = Math.max(box[2] - box[0], 1), h = Math.max(box[3] - box[1], 1);
    const k = Math.max(0.7, Math.min(24,
      Math.min((R - L - pad * 2) / w, (B - T - pad * 2) / h)));
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    tween(k, (L + R) / 2 - cx * k, (T + B) / 2 - cy * k);
  }

  function tween(k, tx, ty) {
    const from = { k: view.k, tx: view.tx, ty: view.ty };
    const t0 = performance.now(), ms = 340;
    if (anim) cancelAnimationFrame(anim);
    const step = now => {
      const u = Math.min(1, (now - t0) / ms);
      const e = 1 - Math.pow(1 - u, 3);
      view.k = from.k + (k - from.k) * e;
      view.tx = from.tx + (tx - from.tx) * e;
      view.ty = from.ty + (ty - from.ty) * e;
      zoomVal.textContent = view.k.toFixed(1) + '×';
      if (u < 1) { anim = requestAnimationFrame(step); draw(); }
      else { anim = null; draw(); }
    };
    anim = requestAnimationFrame(step);
  }

  // 一覧の行・地図の札のどちらをタップしても同じ
  function setPicked(n) {
    if (picked === n) {                       // もう一度押したら戻す
      picked = -1;
      tween(1, 0, 0);
      renderList();
      return;
    }
    picked = n;
    const s = data && data.spots.find(x => x.node === n);
    renderList();
    if (s && s.state !== 'home') flyTo(routeBox(s));
    else draw();
  }

  function measure(text, size) {
    ctx.font = size + 'px "Hiragino Sans","Noto Sans JP",sans-serif';
    return ctx.measureText(text).width;
  }

  // ---- 答えの取り出し ----
  // サーバは使わない。自宅ごとに先に計算した data/home/<駅>.bin を 1 回読むだけで、
  // 時刻を動かしてもその場で引ける（GitHub Pages に置けるようにするため）。
  const busy = document.getElementById('busy');
  const homeCache = new Map();
  let reqId = 0;

  function parseHome(buf) {
    const v = new DataView(buf);
    if (String.fromCharCode(v.getUint8(0), v.getUint8(1), v.getUint8(2), v.getUint8(3)) !== 'SHDN')
      throw new Error('形式が違う');
    let p = 6;
    const node = v.getUint16(p, true); p += 2;
    const ns = v.getUint8(p); p += 1;
    const nt = v.getUint16(p, true); p += 2;
    const tFrom = v.getUint16(p, true); p += 2;
    const tStep = v.getUint8(p); p += 1;
    const limit = new Int16Array(ns);
    for (let i = 0; i < ns; i++) { limit[i] = v.getInt16(p, true); p += 2; }
    const allKm = new Uint16Array(ns);
    for (let i = 0; i < ns; i++) { allKm[i] = v.getUint16(p, true); p += 2; }
    const allNight = new Uint16Array(ns), allDay = new Uint16Array(ns);
    for (let i = 0; i < ns; i++) { allNight[i] = v.getUint16(p, true); p += 2; }
    for (let i = 0; i < ns; i++) { allDay[i] = v.getUint16(p, true); p += 2; }
    const first = new Uint16Array(ns);     // 始発を待ったときの到着時刻（翌朝の分）
    for (let i = 0; i < ns; i++) { first[i] = v.getUint16(p, true); p += 2; }
    const firstDep = new Uint16Array(ns);  // その始発の発車時刻（＝待ち時間の終わり）
    for (let i = 0; i < ns; i++) { firstDep[i] = v.getUint16(p, true); p += 2; }
    const n = ns * nt, cols = {};
    for (const k of ['off', 'at', 'km', 'fare', 'tr', 'tx']) {
      const a = new Uint16Array(n);
      for (let i = 0; i < n; i++) { a[i] = v.getUint16(p, true); p += 2; }
      cols[k] = a;
    }
    const trPaths = [];
    let m = v.getUint16(p, true); p += 2;
    for (let i = 0; i < m; i++) {
      const c = v.getUint8(p); p += 1;
      const a = new Array(c);
      for (let j = 0; j < c; j++) { a[j] = v.getUint16(p, true); p += 2; }
      trPaths.push(a);
    }
    const txPaths = [];
    m = v.getUint16(p, true); p += 2;
    for (let i = 0; i < m; i++) {
      const c = v.getUint16(p, true); p += 2;
      const a = new Array(c);
      for (let j = 0; j < c; j++) {
        a[j] = [v.getInt16(p, true), v.getInt16(p + 2, true)]; p += 4;
      }
      txPaths.push(a);
    }
    return { node, ns, nt, tFrom, tStep, limit, allKm, allNight, allDay, first, firstDep,
             trPaths, txPaths, ...cols };
  }

  // 運賃は先に計算して持っている（JS 側で計算すると丸めが食い違うため）
  const isNight = m => { const x = ((m % 1440) + 1440) % 1440; return x >= 22 * 60 || x < 5 * 60; };

  function compute(H, t) {
    const ti = Math.round((t - H.tFrom) / H.tStep);
    const out = [];
    for (let si = 0; si < H.ns; si++) {
      const s = SPOTS[si], row = { node: s.node, name: s.name };
      if (s.node === home) { row.state = 'home'; out.push(row); continue; }
      const lv = H.limit[si];
      row.limit = lv < 0 ? null : lv;
      if (row.limit !== null && t <= row.limit) {
        row.state = 'train'; row.left = row.limit - t; out.push(row); continue;
      }
      const i = si * H.nt + ti, off = H.off[i];
      if (off === 0xFFFF) { row.state = 'unknown'; out.push(row); continue; }
      row.state = 'taxi';
      row.off = off;
      row.offName = NODES[off].n;
      row.offTime = H.at[i];
      row.trainMin = row.offTime - t;
      row.km = H.km[i] === 0xFFFF ? null : Math.round(H.km[i] / 10) / 10;
      row.fare = H.fare[i] === 0xFFFF ? null : H.fare[i];
      const a = isNight(t) ? H.allNight[si] : H.allDay[si];
      row.allTaxi = a === 0xFFFF ? null : a;
      // 始発を待つという手もある。到着は翌朝なので 1440 分ぶん先。
      // 待ち時間の終わりは「着く時刻」ではなく「乗れる時刻」なので、発車で測る
      if (H.first[si] !== 0xFFFF && H.firstDep[si] !== 0xFFFF) {
        row.firstAt = H.first[si];
        row.firstDep = H.firstDep[si];
        row.firstWait = 1440 + H.firstDep[si] - t;
      }
      row.trainPath = H.tr[i] === 0xFFFF ? null
        : H.trPaths[H.tr[i]].map(id => [NODES[id].y, NODES[id].x]);
      if (H.tx[i] === 0xFFFF) row.taxiPath = null;
      else {
        let cy = Math.round(NODES[off].y * 1e5), cx = Math.round(NODES[off].x * 1e5);
        row.taxiPath = H.txPaths[H.tx[i]].map(([dy, dx]) => {
          cy += dy; cx += dx; return [cy / 1e5, cx / 1e5];
        });
      }
      out.push(row);
    }
    return { home, homeName: NODES[home].n, t: t, spots: out };
  }

  async function load() {
    const my = ++reqId;
    let H = homeCache.get(home);
    if (!H) {
      busy.style.display = 'block';
      try {
        const r = await fetch('data/home/' + home + '.bin');
        H = parseHome(await r.arrayBuffer());
        if (homeCache.size > 60) homeCache.clear();
        homeCache.set(home, H);
      } catch (e) {
        if (my === reqId) busy.style.display = 'none';
        return;                                   // そのまま前の結果を出す
      }
      if (my !== reqId) return;
      busy.style.display = 'none';
    }
    const next = compute(H, t0);
    catchLastTrains(next);
    data = next;
    render();
  }

  // ---- 終電が落ちた瞬間 ----
  // 「数字が書き換わった」ではなく「出来事が起きた」ように見せる。
  // 時刻を大きく飛ばしたときは一斉に光って騒がしいので、1〜2 コマぶんのときだけ。
  const FLASH_MS = 1100;
  const flashes = new Map();            // 駅 -> 光りはじめた時刻
  let flashRaf = null, prevStates = null, prevT = null;
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  function catchLastTrains(next) {
    const now = new Map(next.spots.map(s => [s.node, s.state]));
    const gone = [];
    if (prevStates && prevT != null && Math.abs(t0 - prevT) <= 10) {
      for (const s of next.spots)
        if (s.state === 'taxi' && prevStates.get(s.node) === 'train') gone.push(s);
    }
    prevStates = now; prevT = t0;
    if (!gone.length) return;
    const at = performance.now();
    for (const s of gone) flashes.set(s.node, at);
    pumpFlash();
    toastEl.innerHTML = '<b>' + gone.map(s => s.name).join('・')
      + '</b> の終電が、いま行きました。';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function pumpFlash() {
    if (flashRaf) return;
    const step = () => {
      const now = performance.now();
      for (const [n, at] of [...flashes]) if (now - at > FLASH_MS) flashes.delete(n);
      flashRaf = flashes.size ? requestAnimationFrame(step) : null;
      if (!anim) draw();
    };
    flashRaf = requestAnimationFrame(step);
  }

  function render() { draw(); renderList(); }

  // 地図と一覧は同じ hover を見る。どちらを指しても両方が反応する
  function setHover(n) {
    if (hover === n) return;
    hover = n;
    for (const el of document.querySelectorAll('.item'))
      el.classList.toggle('on', +el.dataset.node === n);
    draw();
  }

  // 札の上も当たり判定にする（都心では点より札のほうが指しやすい）
  function labelAt(mx, my) {
    for (const [x0, y0, x1, y1, n] of HITS)
      if (mx >= x0 && mx <= x1 && my >= y0 && my <= y1) return n;
    return -1;
  }
  function spotAt(mx, my) {
    const n = labelAt(mx, my);
    if (n >= 0) return n;
    if (data) for (const s of data.spots) {
      const dx = SX(s.node) - mx, dy = SY(s.node) - my;
      if (dx * dx + dy * dy < 169) return s.node;
    }
    return -1;
  }

  function renderList() {
    const box = document.getElementById('items');
    box.innerHTML = '';
    if (!data) return;
    const rows = data.spots.slice().sort((a, b) => {
      const r = s => s.state === 'home' ? -1 : s.state === 'train' ? 0 : 1;
      if (r(a) !== r(b)) return r(a) - r(b);
      if (a.state === 'train') return a.left - b.left;
      return (a.fare || 0) - (b.fare || 0);
    });
    for (const s of rows) {
      const d = document.createElement('div');
      d.className = 'item';
      const col = stateColor(s);
      let right = '', sub = '';
      if (s.state === 'home') { right = '自宅'; }
      else if (s.state === 'train') {
        right = 'あと ' + s.left + '分';
        sub = fmt(s.limit) + ' 発が最後';
      } else if (s.state === 'taxi') {
        right = yen(s.fare);
        sub = s.off === s.node ? '電車はもう無い・' + s.km + 'km'
          : s.offName + ' まで電車 ' + s.trainMin + '分 → ' + s.km + 'km';
      } else { right = '—'; }
      // 終電後は「始発まで待つ」も選べる。お金を払うか、時間を払うか
      const alt = s.state === 'taxi' && s.firstWait != null
        ? '<div class="alt">始発を待つなら <b>' + fmt(s.firstDep) + ' 発</b>（あと '
          + span(s.firstWait) + '）→ ' + fmt(s.firstAt) + ' 着</div>'
        : '';
      d.innerHTML = '<div><div class="nm">' + s.name
        + (s.state === 'taxi' && s.allTaxi && s.allTaxi > s.fare
            ? '<small>全部タクシーなら ' + yen(s.allTaxi) + '</small>' : '')
        + '</div><div class="sub">' + sub + '</div></div>'
        + '<div class="col"><div class="vl" style="color:' + col + '">' + right + '</div></div>'
        + alt;
      d.dataset.node = s.node;
      if (hover === s.node) d.classList.add('on');
      if (picked === s.node) d.classList.add('sel');
      d.onmouseenter = () => setHover(s.node);
      d.onmouseleave = () => setHover(-1);
      d.onclick = () => setPicked(s.node);
      box.appendChild(d);
    }
    document.getElementById('list-title').textContent =
      '飲む場所ごとの帰り方（' + fmt(t0) + ' に店を出る）';
  }

  // ---- 操作 ----
  const homeName = document.getElementById('home-name');
  function setHome(i) {
    home = i;
    const h = INDEX.homes.find(x => x.node === i);
    homeName.textContent = h ? h.dir + ' ' + Math.round(h.km) + 'km' : NODES[i].n;
    homeSel.value = i;
    picked = -1;
    prevStates = null;        // 自宅が変われば帰り方は別物。前との比較はしない
    flashes.clear();
    load();
  }

  // 自宅は 10 駅から選ぶ（scripts/pick_homes.py で方角と距離が散るように決めてある）
  const homeSel = document.getElementById('home-sel');
  for (const h of INDEX.homes) {
    const o = document.createElement('option');
    o.value = h.node; o.textContent = h.name;
    homeSel.appendChild(o);
  }
  homeSel.value = home;
  homeSel.onchange = () => setHome(+homeSel.value);

  const timeEl = document.getElementById('time'), timeVal = document.getElementById('time-val');
  const playBtn = document.getElementById('play');
  const zoomVal = document.getElementById('zoom-val');
  let timer = null;
  timeEl.addEventListener('input', () => {
    if (playing) setPlaying(false);
    t0 = +timeEl.value; timeVal.textContent = fmt(t0); setNight(t0); draw();
    clearTimeout(timer); timer = setTimeout(load, 120);
  });

  let playing = false, playTimer = null;
  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? '停止' : '時刻を進める';
    playBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (playTimer) clearInterval(playTimer);
    playTimer = null;
    if (!on) return;
    playTimer = setInterval(() => {
      t0 += 5;
      if (t0 > +timeEl.max) t0 = +timeEl.min;
      timeEl.value = t0; timeVal.textContent = fmt(t0); setNight(t0);
      load();
    }, 700);
  }
  playBtn.onclick = () => setPlaying(!playing);

  document.getElementById('zoom-in').onclick = () => zoomAt(W / 2, H / 2, 1.5);
  document.getElementById('zoom-out').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.5);
  document.getElementById('zoom-reset').onclick = () => {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    picked = -1; renderList();
    view.k = 1; view.tx = 0; view.ty = 0; zoomVal.textContent = '1.0×'; draw();
  };
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.03 : 0.0012)));
  }, { passive: false });

  const tip = document.getElementById('tip');
  function nearest(mx, my) {
    let best = -1, bd = 18 * 18;
    for (const i of VIS) {
      const dx = SX(i) - mx, dy = SY(i) - my, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, moved: false };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4) drag.moved = true;
      if (drag.moved) {
        view.tx = drag.tx + dx; view.ty = drag.ty + dy;
        clampView(); tip.style.display = 'none'; cv.style.cursor = 'grabbing';
        setHover(-1); draw();
      }
      return;
    }
    setHover(spotAt(e.clientX, e.clientY));
    // 札の上では、その裏にたまたまある駅の吹き出しを出さない
    if (labelAt(e.clientX, e.clientY) >= 0) {
      tip.style.display = 'none'; cv.style.cursor = 'pointer'; return;
    }
    const i = nearest(e.clientX, e.clientY);
    if (i < 0) { tip.style.display = 'none'; cv.style.cursor = 'grab'; return; }
    cv.style.cursor = 'pointer';
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top = (e.clientY + 12) + 'px';
    tip.innerHTML = '<b>' + NODES[i].n + '</b>';
  });
  cv.addEventListener('pointerup', e => {
    if (!drag) return;
    const was = drag.moved; drag = null; cv.style.cursor = 'grab';
    if (was) return;
    const n = labelAt(e.clientX, e.clientY);
    if (n >= 0) setPicked(n);                  // 札をタップ＝その帰り方を見る
    // 自宅はセレクトから選ぶ。地図のクリックでは変えない
  });
  cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; setHover(-1); });
  window.addEventListener('resize', () => { layout(); clampView(); draw(); });

  document.getElementById('foot').innerHTML =
    '出典: <a href="https://www.odpt.org/" target="_blank" rel="noopener">公共交通オープンデータセンター</a>'
    + ' の駅・列車時刻表（平日ダイヤ、鉄道 10 事業者 ' + base.lines.length + ' 路線）。'
    + '地図は<a href="https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-N03-v3_1.html" target="_blank" rel="noopener">国土数値情報（行政区域 2025年）</a>を加工。'
    + 'タクシー運賃は東京都特別区・武三交通圏の普通車（初乗り 1.0km 500 円／以後 232m ごと 100 円／22〜5 時は 2 割増）で概算。'
    + '渋滞時の時間距離併用運賃と高速代は見ていないため<b>実際より安めに出ます</b>。'
    + '東急・小田急・京急・西武は列車単位の時刻表が提供されていないため含みません。'
    + '<b>深夜バスは GTFS に無いため考慮していません。</b>'
    + 'データの正確性・完全性は保証されません。交通事業者への直接のお問い合わせはご遠慮ください。'
    + '／静的データ取得日 2026-09-28';

  layout();
  cv.style.cursor = 'grab';
  {
    const h = INDEX.homes.find(x => x.node === home);
    homeName.textContent = h ? h.dir + ' ' + Math.round(h.km) + 'km' : NODES[home].n;
  }
  timeVal.textContent = fmt(t0);
  setNight(t0);
  timeEl.value = t0;
  draw();
  await load();
})();
</script>
</body>
</html>
